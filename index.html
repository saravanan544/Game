<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Tower</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <h1>CHAOS TOWER</h1>
    <p class="version">Version 0.1 Alpha</p>

    <div id="background">
        Background Placeholder
    </div>

    <div id="playerInfo">
        <p>🏆 Highest Floor: <span id="floor">1</span></p>
        <p>⭐ Level: <span id="level">1</span></p>
        <p>💰 Gold: <span id="gold">0</span></p>
    </div>

    <button id="enterTower">
        🏰 ENTER TOWER
    </button>

    <div id="menu">

        <button>⚔ Character</button>
        <button>🎒 Inventory</button>

        <button>⚒ Blacksmith</button>
        <button>🧪 Alchemist</button>

        <button>🛒 Merchant</button>
        <button>📖 Codex</button>

        <button>⚙ Settings</button>
        <button>❓ Help</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
