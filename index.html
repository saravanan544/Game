<!DOCTYPE html>
<html>
<head>
  <title>Mini RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Mini RPG</h2>

<!-- PLAYER BAR -->
<div id="playerBar">
  ❤️ <span id="hp"></span>
  ⚔️ <span id="atk"></span>
  🛡️ <span id="def"></span>
  ⚡ <span id="stam"></span>
  ⭐ Lv:<span id="lvl"></span> (Pts: <span id="pts"></span>)
</div>

<!-- ENEMY -->
<div id="enemyBox">
  <h3 id="enemyName"></h3>
  <p>HP: <span id="enemyHp"></span></p>
</div>

<!-- ACTIONS -->
<div id="actions"></div>

<!-- LOG -->
<div id="log"></div>

<!-- INVENTORY PANEL -->
<button onclick="toggleInv()">🎒 Inventory</button>

<div id="invPanel" class="hidden">
  <button onclick="showTab('inv')">Inventory</button>
  <button onclick="showTab('equip')">Equipment</button>

  <div id="inventory"></div>
  <div id="equipment" class="hidden"></div>
</div>

<!-- POPUP -->
<div id="popup" class="hidden"></div>

<script src="game.js"></script>
</body>
</html>
