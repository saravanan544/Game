<!DOCTYPE html>
<html>
<head>
  <title>Mini RPG</title>

  <style>

    body{
      background:#111;
      color:white;
      font-family:Arial;
      text-align:center;
      margin:0;
      padding:0;
    }

    h2{
      margin-top:10px;
    }

    #playerBar{
      background:#222;
      padding:12px;
      font-size:18px;
    }

    #enemyBox{
      margin-top:20px;
    }

    #enemyImg{
      width:260px;
      height:260px;
      object-fit:contain;
      background:#222;
      border-radius:12px;
      padding:10px;
    }

    button{
      background:#333;
      color:white;
      border:none;
      padding:12px;
      margin:5px;
      border-radius:10px;
      font-size:16px;
    }

    #actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:10px;
    }

    #actions button{
      width:42%;
    }

    #log{
      background:#222;
      margin:10px;
      padding:10px;
      height:150px;
      overflow-y:auto;
      text-align:left;
      border-radius:10px;
    }

    #invPanel{
      background:#222;
      margin:10px;
      padding:10px;
      border-radius:10px;
    }

    #inventory{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-top:10px;
    }

    #inventory button{
      min-height:60px;
    }

    #equipment{
      margin-top:10px;
      text-align:left;
    }

    #popup{
      position:fixed;
      top:30%;
      left:10%;
      width:80%;
      background:#333;
      border-radius:12px;
      padding:20px;
    }

    .hidden{
      display:none;
    }

  </style>
</head>

<body>

  <h2>⚔️ Mini RPG</h2>

  <!-- PLAYER -->

  <div id="playerBar">

    ❤️ HP:
    <span id="hp"></span>

    |
    
    ⚔️ ATK:
    <span id="atk"></span>

    |

    🛡️ DEF:
    <span id="def"></span>

    |

    ⚡ STAM:
    <span id="stam"></span>

    <br><br>

    ⭐ LVL:
    <span id="lvl"></span>

    |

    🎯 PTS:
    <span id="pts"></span>

  </div>

  <!-- ENEMY -->

  <div id="enemyBox">

    <img id="enemyImg" src="" alt="enemy">

    <h2 id="enemyName"></h2>

    <p>
      ❤️ HP:
      <span id="enemyHp"></span>
    </p>

  </div>

  <!-- ACTIONS -->

  <div id="actions"></div>

  <!-- LOG -->

  <div id="log"></div>

  <!-- INVENTORY -->

  <button onclick="toggleInv()">
    🎒 Inventory
  </button>

  <div id="invPanel" class="hidden">

    <button onclick="showTab('inv')">
      Inventory
    </button>

    <button onclick="showTab('equip')">
      Equipment
    </button>

    <div id="inventory"></div>

    <div id="equipment" class="hidden"></div>

  </div>

  <!-- POPUP -->

  <div id="popup" class="hidden"></div>

  <script>

    // =====================
    // PLAYER
    // =====================

    let player = {

      atk:10,
      def:5,

      hp:20,

      stam:50,
      maxStam:50,

      lvl:1,
      pts:0,

      inventory:[],

      equip:{
        weapon:null,
        gloves:null,
        armor:null,
        pants:null,
        shoes:null,
        helmet:null
      }

    };

    // =====================
    // ITEMS
    // =====================

    const items = {

      sword:{
        name:"🗡️ Sword",
        type:"weapon",
        atk:10
      },

      gloves:{
        name:"🧤 Gloves",
        type:"gloves",
        atk:3
      },

      armor:{
        name:"🛡️ Armor",
        type:"armor",
        def:10
      },

      pants:{
        name:"👖 Pants",
        type:"pants",
        def:5
      },

      shoes:{
        name:"👢 Shoes",
        type:"shoes",
        atk:5
      },

      helmet:{
        name:"⛑️ Helmet",
        type:"helmet",
        def:3
      },

      potion:{
        name:"🧪 Stamina Potion",
        type:"consumable",
        stam:20
      }

    };

    // =====================
    // MOBS
    // =====================

    const mobs = [

      {
        name:"Goblin",
        image:"dd7d6e9bca50bd9011af5184877f5908.jpg",
        hp:40,
        atk:8,
        def:3,
        drops:["sword","gloves"]
      },

      {
        name:"Orc",
        image:"7ced516cb67aada28ae8bb40c3d9bf2d.jpg",
        hp:70,
        atk:12,
        def:6,
        drops:["armor","pants"]
      },

      {
        name:"Wolf",
        image:"3681ade6ec9735d496ef510d6fbc5bc8.jpg",
        hp:50,
        atk:10,
        def:4,
        drops:["shoes","helmet"]
      }

    ];

    let enemy = null;

    // =====================
    // UPDATE UI
    // =====================

    function updateUI(){

      document.getElementById("hp").innerText =
        player.hp;

      document.getElementById("atk").innerText =
        player.atk;

      document.getElementById("def").innerText =
        player.def;

      document.getElementById("stam").innerText =
        player.stam + "/" + player.maxStam;

      document.getElementById("lvl").innerText =
        player.lvl;

      document.getElementById("pts").innerText =
        player.pts;

      if(enemy){

        document.getElementById("enemyName").innerText =
          enemy.name;

        document.getElementById("enemyHp").innerText =
          enemy.hp;

        document.getElementById("enemyImg").src =
          enemy.image;
      }

      renderInventory();

      renderEquip();

      renderActions();
    }

    // =====================
    // LOG
    // =====================

    function log(msg){

      let logBox =
        document.getElementById("log");

      logBox.innerHTML += `
        <div>${msg}</div>
      `;

      logBox.scrollTop =
        logBox.scrollHeight;
    }

    // =====================
    // NEW ENEMY
    // =====================

    function newEnemy(){

      let mob =
        mobs[Math.floor(Math.random()*mobs.length)];

      enemy = {...mob};

      log("Encountered " + enemy.name);

      updateUI();
    }

    // =====================
    // ATTACK
    // =====================

    function attack(mult){

      if(!enemy){
        return;
      }

      let cost =
        (mult === 1 ? 5 : 10);

      if(player.stam < cost){

        log("Not enough stamina");

        return;
      }

      player.stam -= cost;

      let dmg =
        Math.max(
          1,
          Math.floor((player.atk * mult) - enemy.def)
        );

      enemy.hp -= dmg;

      log("You dealt " + dmg + " damage");

      // ENEMY DEAD

      if(enemy.hp <= 0){

        winFight();

        return;
      }

      // ENEMY ATTACK

      let edmg =
        Math.max(1, enemy.atk - player.def);

      player.hp -= edmg;

      log(enemy.name + " dealt " + edmg + " damage");

      // PLAYER DEAD

      if(player.hp <= 0){

        alert("Game Over");

        location.reload();

        return;
      }

      updateUI();
    }

    // =====================
    // WIN FIGHT
    // =====================

    function winFight(){

      log(enemy.name + " defeated!");

      mobDrops();

      player.lvl += 1;

      player.pts += 1;

      chooseStat();

      enemy = null;

      updateUI();
    }

    // =====================
    // DROPS
    // =====================

    function mobDrops(){

      enemy.drops.forEach(drop => {

        if(Math.random() < 0.4){

          player.inventory.push(drop);

          log("Dropped: " + items[drop].name);
        }

      });

      if(Math.random() < 0.4){

        player.inventory.push("potion");

        log("Dropped: 🧪 Potion");
      }
    }

    // =====================
    // LEVEL STAT
    // =====================

    function chooseStat(){

      let stat =
        prompt("Choose stat: atk / def / stam");

      if(stat === "atk"){

        player.atk += 1;
      }

      else if(stat === "def"){

        player.def += 1;
      }

      else if(stat === "stam"){

        player.maxStam += 5;

        player.stam += 5;
      }

      player.hp =
        (player.def * 2) + player.atk;
    }

    // =====================
    // INVENTORY
    // =====================

    function renderInventory(){

      let inv =
        document.getElementById("inventory");

      inv.innerHTML = "";

      player.inventory.forEach((item,index)=>{

        let btn =
          document.createElement("button");

        btn.innerText =
          items[item].name;

        btn.onclick = ()=>{

          showPopup(item,index);
        };

        inv.appendChild(btn);

      });

    }

    // =====================
    // POPUP
    // =====================

    function showPopup(item,index){

      let popup =
        document.getElementById("popup");

      popup.classList.remove("hidden");

      popup.innerHTML = `

        <h3>${items[item].name}</h3>

        <button onclick="useItem('${item}',${index})">
          Use / Equip
        </button>

        <button onclick="closePopup()">
          Cancel
        </button>

      `;
    }

    function closePopup(){

      document
        .getElementById("popup")
        .classList.add("hidden");
    }

    // =====================
    // USE ITEM
    // =====================

    function useItem(item,index){

      let it = items[item];

      // POTION

      if(it.type === "consumable"){

        player.stam += it.stam;

        if(player.stam > player.maxStam){

          player.stam = player.maxStam;
        }

        log("Recovered stamina");
      }

      // EQUIP

      else {

        let slot = it.type;

        // REMOVE OLD STATS

        let oldItem =
          player.equip[slot];

        if(oldItem){

          let old =
            items[oldItem];

          if(old.atk){
            player.atk -= old.atk;
          }

          if(old.def){
            player.def -= old.def;
          }
        }

        // EQUIP NEW

        player.equip[slot] = item;

        if(it.atk){
          player.atk += it.atk;
        }

        if(it.def){
          player.def += it.def;
        }

        log("Equipped " + it.name);
      }

      player.hp =
        (player.def * 2) + player.atk;

      player.inventory.splice(index,1);

      closePopup();

      updateUI();
    }

    // =====================
    // EQUIPMENT UI
    // =====================

    function renderEquip(){

      let eq =
        document.getElementById("equipment");

      eq.innerHTML = "";

      for(let slot in player.equip){

        let equipped =
          player.equip[slot];

        eq.innerHTML += `

          <div>

            ${slot} :

            ${
              equipped
              ? items[equipped].name
              : "None"
            }

          </div>

        `;
      }
    }

    // =====================
    // ACTIONS
    // =====================

    function renderActions(){

      let act =
        document.getElementById("actions");

      if(!enemy){

        act.innerHTML = `

          <button onclick="newEnemy()">

            🔍 Find Enemy

          </button>

        `;

        return;
      }

      act.innerHTML = `

        <button onclick="attack(1)">
          ⚔️ Attack
        </button>

        <button onclick="attack(1.5)">
          💥 Heavy
        </button>

        <button onclick="toggleInv()">
          🎒 Inventory
        </button>

      `;
    }

    // =====================
    // INVENTORY TABS
    // =====================

    function toggleInv(){

      document
        .getElementById("invPanel")
        .classList.toggle("hidden");
    }

    function showTab(tab){

      document
        .getElementById("inventory")
        .classList.toggle(
          "hidden",
          tab !== "inv"
        );

      document
        .getElementById("equipment")
        .classList.toggle(
          "hidden",
          tab !== "equip"
        );
    }

    // =====================
    // START
    // =====================

    player.hp =
      (player.def * 2) + player.atk;

    newEnemy();

    updateUI();

  </script>

</body>
</html>
