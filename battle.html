<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chaos Tower - Battle</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>⚔ CHAOS TOWER</h1>

    <h3 id="floorText">Floor 1</h3>

    <div class="enemyCard">

        <img id="monsterImg" src="images/monsters/goblin.png">

        <h2 id="monsterName">Goblin</h2>

        <div class="barWrap">

            <div id="enemyHpBar"></div>

        </div>

        <p id="enemyHpText">
            40 / 40 HP
        </p>

    </div>

    <div class="playerCard">

        <h2>🧙 Adventurer</h2>

        <div class="barWrap">

            <div id="playerHpBar"></div>

        </div>

        <p id="playerHpText">
            20 / 20 HP
        </p>

        <p id="playerStats">

            Lv.1

            ⚔10

            🛡5

            ⚡50

        </p>

    </div>

    <div class="battleButtons">

        <button id="attackBtn">

            ⚔ Attack

        </button>

        <button id="heavyBtn">

            💥 Heavy

        </button>

        <button id="inventoryBtn">

            🎒 Inventory

        </button>

        <button id="runBtn">

            🏃 Run

        </button>

    </div>

    <div id="log">

        <p>Welcome to Chaos Tower.</p>

    </div>

</div>

<script src="battle.js"></script>

</body>

</html>
