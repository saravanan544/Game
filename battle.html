<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chaos Tower - Battle</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header>

        <h1>CHAOS TOWER</h1>

        <p class="version" id="floorText">
            Floor 1
        </p>

    </header>

    <!-- Enemy Card -->

    <section class="card enemyCard">

        <img
            id="enemyImg"
            class="monsterImg"
            src="images/monsters/goblin.png"
            alt="Monster">

        <h2 id="enemyName">

            Goblin

        </h2>

        <div class="bar">

            <div id="enemyHpBar"></div>

        </div>

        <p id="enemyHpText">

            HP 40 / 40

        </p>

    </section>

    <!-- Player Card -->

    <section class="card playerCard">

        <h2>

            Adventurer

        </h2>

        <h3>❤️ HP</h3>

<div class="bar">

    <div id="playerHpBar"></div>

</div>

<p id="playerHpText">

    HP 20 / 20

</p>

<h3>✨ EXP</h3>

<div class="bar">

    <div id="playerExpBar"></div>

</div>

<p id="playerExpText">

    EXP 0 / 50

</p>

        <div class="stats">

            <span id="playerLevel">

                ⭐ Lv.1

            </span>

            <span id="playerAtk">

                ⚔ 10

            </span>

            <span id="playerDef">

                🛡 5

            </span>

            <span id="playerStam">

                ⚡ 50

            </span>

            <span id="playerGold">

                💰 0

            </span>

        </div>

    </section>

    <!-- Action Buttons -->

    <section class="actions">

        <button id="attackBtn" class="attack">

            ⚔ Attack

        </button>

        <button id="heavyBtn" class="heavy">

            💥 Heavy

        </button>

        <button id="inventoryBtn" class="inventory">

            🎒 Inventory

        </button>

        <button id="runBtn" class="run">

            🏃 Run

        </button>

    </section>

    <!-- Battle Log -->

    <section id="battleLog">

        <p>

            Welcome to Chaos Tower...

        </p>

    </section>

</div>

<script src="battle.js"></script>

</body>
</html>
