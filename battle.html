<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chaos Tower - Battle</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Floor 1</h1>

    <p id="battleStatus">
        A wild monster appeared!
    </p>

    <!-- Monster -->

    <div class="enemyCard">

        <img
            id="enemyImg"
            src="images/monsters/goblin.png"
            alt="Monster">

        <h2 id="enemyName">
            Goblin
        </h2>

        <div class="barWrap">

            <div id="enemyHpBar"></div>

        </div>

        <p>
            HP :
            <span id="enemyHp">40</span>
            /
            <span id="enemyMaxHp">40</span>
        </p>

    </div>

    <!-- Player -->

    <div class="playerCard">

        <h3>Your HP</h3>

        <div class="barWrap">

            <div id="playerHpBar"></div>

        </div>

        <p>

            HP :
            <span id="playerHp">20</span>
            /
            <span id="playerMaxHp">20</span>

        </p>

    </div>

    <!-- Buttons -->

    <div class="battleButtons">

        <button onclick="attack()">

            ⚔ Attack

        </button>

        <button onclick="heavyAttack()">

            💥 Heavy

        </button>

        <button onclick="openInventory()">

            🎒 Inventory

        </button>

        <button onclick="runAway()">

            🏃 Run

        </button>

    </div>

    <div id="battleLog">

    </div>

</div>

<script src="battle.js"></script>

</body>
          </html>
